# Fiktive Teilrechnung: eine abgenommene Teilleistung, endgültig abgerechnet.
# Anders als ein Abschlag wird sie nie in einer Schlussrechnung abgesetzt.
nummer: R26-012
art: teilrechnung
datum: 2026-09-15
leistungszeitraum:
  von: 2026-06-01
  bis: 2026-08-31
kunde:
  name: Beispiel Software GmbH
  anschrift:
    strasse: Industriestraße 1
    plz: "90402"
    ort: Nürnberg
einleitung: >-
  Für Projekt Süd berechnen wir den am 31.08.2026 abgenommenen
  Meilenstein 1:
positionen:
  - bezeichnung: Projekt Süd, Meilenstein 1
    beschreibung: Abnahme vom 31.08.2026
    menge: 1
    einheit: pauschal
    einzelpreis: 6500.00
  # Ein Rabatt (#213): Die Spalte steht, und die Position ohne Rabatt lässt
  # ihre Zelle leer.
  - bezeichnung: Einführungsworkshop
    menge: 1
    einheit: Stück
    einzelpreis: 800.00
    rabatt: 30
  # Derselbe Rabatt als fester Betrag (#233). Beide Formen auf einem Blatt:
  # In der Spalte stehen dann "30 %", "100,00 €" und eine leere Zelle.
  - bezeichnung: Schulungsunterlagen
    menge: 40
    einheit: Stück
    einzelpreis: 12.50
    rabatt-betrag: 100.00
