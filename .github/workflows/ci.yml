# CI ohne die externen Werkzeuge (#136): baut, lintet und testet alles außer
# den Tests mit dem Kotest-Tag `Toolchain`, die LuaLaTeX und pdftotext
# brauchen. Was hier grün wird, beweist NICHT die PDF/A-Gültigkeit; die prüft
# weiterhin der lokale `./gradlew build` vor dem Merge.
#
# Der EU-Alterstest läuft absichtlich mit (kein EU_LISTE_ALTERSPRUEFUNG=aus):
# Wird er rot, ist EuMemberStates.AS_OF nachzuprüfen – das ist der Zweck.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Ein neuer Push auf denselben PR bricht den laufenden, überholten Lauf ab.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Nur das JDK, das Gradle selbst startet – das Toolchain-JDK 21 aus
      # build.gradle.kts lädt der Foojay-Resolver bei Bedarf selbst.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # Gradle-Cache und Wrapper-Prüfung.
      #
      # cache-provider: basic ist die MIT-lizenzierte Zwischenspeicherung über
      # actions/cache. Die Vorgabe 'enhanced' lädt seit v6 die proprietäre
      # Bibliothek gradle-actions-caching, deren Nutzung die Terms of Use von
      # Gradle voraussetzt; mit 'basic' wird sie laut DISTRIBUTION.md gar nicht
      # erst geladen. Für ein privates Repository ist 'enhanced' zudem nur eine
      # Free Preview mit angekündigter Bepreisung, 'basic' dagegen dauerhaft
      # frei. Der Preis ist ein gröberer Cache – dieselbe Strategie wie bei
      # actions/setup-java mit cache: gradle.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      # Die Skripttests rufen die Python-Skripte wirklich auf; beide brauchen
      # PyYAML (siehe CLAUDE.md, Umgebung).
      - name: PyYAML installieren
        run: python3 -m pip install pyyaml

      - name: Bauen und testen (ohne Werkzeug-Tests)
        run: ./gradlew build -PohneToolchain
