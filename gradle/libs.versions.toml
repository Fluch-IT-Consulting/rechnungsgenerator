# Gradle Version Catalog: alle Abhängigkeiten und Versionen an einer Stelle.
# In build.gradle.kts wird daraus typsicher z. B. libs.kaml bzw. libs.plugins.kotlin.jvm.

[versions]
kotlin = "2.4.10"
kaml = "0.83.0"          # YAML-Parser auf Basis von kotlinx.serialization
clikt = "5.1.0"          # CLI-Framework (Kommandos, Optionen, Hilfe-Texte)
junit = "6.1.3"
kotest = "6.2.4"       # Test-Framework: FunSpec-Stil + Property-based Testing
ktlintPlugin = "14.2.0"  # Gradle-Plugin; die eigentliche ktlint-Version managt das Plugin
konsist = "0.17.3"       # Architekturtests: Schichten der Pakete, Importe (#112)

[libraries]
kaml = { module = "com.charleskorn.kaml:kaml", version.ref = "kaml" }
# clikt-core statt clikt: die Variante ohne Mordant und damit ohne JNA.
# Wir brauchen nur Argumentverarbeitung und schlichte Textausgabe.
clikt = { module = "com.github.ajalt.clikt:clikt-core", version.ref = "clikt" }
kotest-runner = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
