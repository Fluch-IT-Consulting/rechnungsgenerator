# Gradle Version Catalog: alle Abhängigkeiten und Versionen an einer Stelle.
# In build.gradle.kts wird daraus typsicher z. B. libs.kaml bzw. libs.plugins.kotlin.jvm.
#
# Nennt der Kommentar einer Zeile ein Issue, ist er eine Bedingung und keine
# Fußnote: erst das Issue lesen, dann einen Bump dieser Zeile mergen (#253).

[versions]
kotlin = "2.4.20"       # 2.4.20 wegen CVE-2026-53914 (#158), nicht nur der Aktualität halber
kaml = "0.104.0"          # YAML-Parser auf Basis von kotlinx.serialization
clikt = "5.1.0"          # CLI-Framework (Kommandos, Optionen, Hilfe-Texte)
junit = "6.1.3"
kotest = "6.2.5"       # Test-Framework: FunSpec-Stil + Property-based Testing
ktlintPlugin = "14.2.0"  # Gradle-Plugin; welche ktlint-CLI es startet, sagt ktlintCli
ktlintCli = "1.8.0"      # ktlint selbst; ohne Eintrag wählte das Plugin 1.5.0 (#159)
konsist = "0.17.3"       # Architekturtests: Schichten der Pakete, Importe (#112)
verapdf = "1.30.2"       # PDF/A-Prüfung in derselben JVM (#226); dieselbe Fassung, die Homebrew als CLI führt
mustang = "2.26.0"       # ZUGFeRD: bettet das XML ein und prüft es (ADR-0023)
slf4j = "2.0.20"         # dieselbe Fassung wie slf4j-api, das Mustang mitbringt
# Kommt über veraPDF und Mustang, wird aber nie geladen: ein vollständiger Lauf
# lädt 4455 Klassen, davon 542 aus org.verapdf und keine aus Jackson
# (nachgemessen in #250; ein ZUGFeRD-Lauf mit Mustang ebenso keine, #363).
# Angehoben wegen elf Advisories (#230) – dort auf die Reihe 2.21 festgelegt,
# weil ein Minor-Sprung Verhalten ändert. Genau das trägt hier nicht, und die
# beiden PDF/A-Prüfer urteilen mit 2.22.2 weiterhin gleich. 2.22.2 und nicht
# älter, weil Mustang sie verlangt und die Plattform sonst still überstimmt wäre.
jackson = "2.22.2"

[libraries]
kaml = { module = "com.charleskorn.kaml:kaml", version.ref = "kaml" }
# clikt-core statt clikt: die Variante ohne Mordant und damit ohne JNA.
# Wir brauchen nur Argumentverarbeitung und schlichte Textausgabe.
clikt = { module = "com.github.ajalt.clikt:clikt-core", version.ref = "clikt" }
kotest-runner = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
# validation-model allein genügt für die PDF/A-Prüfung; es zieht Kern, Parser
# und Modell nach. Die -jakarta-Fassung, weil Mustang sie nachzieht und beide
# Familien nebeneinander dieselben Klassen trügen (ADR-0023).
# Lizenz: GPLv3+ oder MPLv2+ nach Wahl – wir wählen MPL-2.0 (#226).
verapdf = { module = "org.verapdf:validation-model-jakarta", version.ref = "verapdf" }
# Mustang nur zum Einbetten und Prüfen; das XML schreibt der Generator selbst,
# weil Mustangs Modell keine Absetzung kennt und anders rundet (ADR-0023).
mustang-library = { module = "org.mustangproject:library", version.ref = "mustang" }
mustang-validator = { module = "org.mustangproject:validator", version.ref = "mustang" }
# Mustang protokolliert über SLF4J; ohne Anbindung schriebe SLF4J bei jedem
# ZUGFeRD-Lauf drei Warnzeilen auf stderr. nop ist die ausdrückliche Antwort
# "kein Protokoll", und API und Anbindung müssen dieselbe Fassung haben.
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
# Die Plattform hebt jackson-databind, -core und -annotations gemeinsam an.
# Einzeln angehoben laufen sie auseinander, und das verträgt Jackson schlecht.
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
